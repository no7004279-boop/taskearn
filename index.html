<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.json"><title>TaskEarn</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f3f6fb;color:#172033}.app{max-width:520px;margin:auto;padding:18px}.top{background:#2563eb;color:white;border-radius:18px;padding:20px;box-shadow:0 8px 25px #0002}.coins{font-size:32px;font-weight:700}.card{background:white;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 3px 12px #0001}.task{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:14px 0}.task:last-child{border:0}.btn{background:#2563eb;color:white;border:0;border-radius:10px;padding:10px 15px;font-weight:700}.nav{display:flex;gap:8px;margin-top:14px}.nav button{flex:1;padding:11px;border:0;border-radius:10px;background:white}.small{color:#687386;font-size:14px}</style></head><body><main class="app"><section class="top"><div>TaskEarn</div><div class="small" style="color:#dbeafe">आपके Coins</div><div class="coins" id="coins">0</div></section><section class="card"><h2>आज के Tasks</h2><div class="task"><div><b>Daily Check-in</b><div class="small">App खोलकर check-in करें</div></div><button class="btn" onclick="earn('checkin',10)">+10</button></div><div class="task"><div><b>Profile Complete</b><div class="small">अपनी profile पूरी करें</div></div><button class="btn" onclick="earn('profile',25)">+25</button></div><div class="task"><div><b>Share Task</b><div class="small">दोस्तों के साथ share करें</div></div><button class="btn" onclick="earn('share',15)">+15</button></div></section><section class="card"><h2>Wallet</h2><p><b id="wallet">0</b> Coins</p><p class="small">Demo version: अभी real withdrawal/payment connected नहीं है.</p><button class="btn" onclick="withdraw()">Withdrawal Request</button></section><section class="card"><h2>History</h2><div id="history" class="small">अभी कोई activity नहीं.</div></section></main><script>let coins=Number(localStorage.getItem('coins')||0);let history=JSON.parse(localStorage.getItem('history')||'[]');const done=JSON.parse(localStorage.getItem('done')||'{}');function render(){document.getElementById('coins').textContent=coins;document.getElementById('wallet').textContent=coins;document.getElementById('history').innerHTML=history.length?history.map(x=>'<div style="padding:7px 0">'+x+'</div>').join(''):'अभी कोई activity नहीं.'}function earn(id,n){if(done[id]){alert('यह task आज हो चुका है.');return}done[id]=1;coins+=n;history.unshift('Task complete: +'+n+' Coins');localStorage.setItem('coins',coins);localStorage.setItem('history',JSON.stringify(history));localStorage.setItem('done',JSON.stringify(done));render()}function withdraw(){if(coins<100){alert('Withdrawal के लिए कम से कम 100 Coins चाहिए.');return}alert('Demo: withdrawal request भेजने के लिए backend/payment system जोड़ना बाकी है.')}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
