<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskEarn</title>
<style>
body{margin:0;font-family:Arial;background:#f1f5f9;color:#172033}.wrap{max-width:760px;margin:auto;padding:18px}
.card{background:#fff;border-radius:24px;padding:24px;margin-bottom:18px;box-shadow:0 5px 20px #0001}.hero{background:#2563eb;color:#fff}
input{width:100%;padding:14px;margin:7px 0;border:1px solid #ddd;border-radius:12px;font-size:16px;box-sizing:border-box}
button{border:0;border-radius:12px;padding:13px 18px;background:#2563eb;color:#fff;font-size:16px;font-weight:bold}button.secondary{background:#e5e7eb;color:#172033}
button:disabled{opacity:.5}.task{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #e5e7eb}.task:last-child{border:0}
.muted{color:#6b7280}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.balance{font-size:44px;font-weight:bold}
#app{display:none}#loading{display:none;text-align:center}.error{color:#b91c1c}.success{color:#15803d}
</style></head>
<body>
<div id="loading" class="wrap"><div class="card">Loading...</div></div>
<div id="login" class="wrap"><div class="card">
<h1>TaskEarn</h1><p class="muted">Online account में Login करें या नया account बनाएं।</p>
<input id="name" placeholder="आपका नाम"><input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password (कम से कम 6 characters)">
<div class="row"><button onclick="signUp()">नया Account</button><button class="secondary" onclick="signIn()">Login</button></div>
<p id="authMessage"></p>
</div></div>
<div id="app" class="wrap">
<div class="card hero"><div class="row"><div><h1>TaskEarn</h1>नमस्ते, <b id="userName"></b> 👋</div><button class="secondary" onclick="logout()">Logout</button></div>
<div class="balance" id="coins">0</div><div>आपके Coins</div></div>
<div class="card"><h2>आज के Tasks</h2>
<div class="task"><div><b>Daily Check-in</b><br><span class="muted">App खोलकर check-in करें</span></div><button id="dailyBtn" onclick="completeTask('daily',10)">+
